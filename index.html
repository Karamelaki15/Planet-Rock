<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Rock Radio</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .main-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #181818;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #ff3b30;
      font-size: 1.8rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #ddd;
    }

    .btn {
      background-color: #ff3b30;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #e03126;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- Red 96.3 Live Radio -->
    <div class="card">
      <h1>🎸 Planet Rock Live</h1>
      <h2>📻 Red 96.3 (Athens Live)</h2>
      <audio id="radioPlayer" preload="none">
        <source src="https://stream.radiojar.com/red963" type="audio/mpeg">
        <source src="https://s3.radiojar.com/red963" type="audio/mpeg">
      </audio>
      <button class="btn" onclick="toggleRadio()">▶ Play Live Radio</button>
    </div>

    <!-- YouTube Playlist Player -->
    <div class="card">
      <h2>🎧 Η Rock Playlist μου</h2>
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/videoseries?list=PLD1ksap8J-BQ" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </div>

  <script>
    const radio = document.getElementById('radioPlayer');
    const btn = document.querySelector('.btn');

    function toggleRadio() {
      if (radio.paused) {
        radio.play().then(() => {
          btn.innerText = '⏸ Pause Live Radio';
        }).catch(err => {
          console.log("Playback error: ", err);
        });
      } else {
        radio.pause();
        btn.innerText = '▶ Play Live Radio';
      }
    }
  </script>

</body>
</html>
