<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Rock Radio</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.4);
      --text-main: #f0f0f0;
      --text-dim: #a0a0a0;
    }

    body {
      background: radial-gradient(circle at top, #1a0810 0%, var(--bg-color) 70%);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .main-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 42, 75, 0.3);
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--accent-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 1rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .btn-main {
      background: linear-gradient(135deg, #ff2a4b 0%, #c41230 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 260px;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 12px;
      min-height: 20px;
    }

    .now-playing-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 16px;
    }

    .now-playing-title {
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0;
      word-break: break-word;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      outline: none;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- RED 96.3 LIVE STATION -->
    <div class="card">
      <h1>🎸 Red 96.3 Live</h1>
      <h2>📻 Αθήνα - Live Stream</h2>
      <button class="btn-main" id="radioBtn" onclick="toggleRadio()">▶ LIVE RADIO</button>
      <div class="status-text" id="radioStatus">Πατήστε Play για ζωντανή μετάδοση</div>
    </div>

    <!-- PLANET ROCK LIVE PLAYLIST -->
    <div class="card">
      <h1>🎧 Planet Rock Live</h1>
      <h2>Η προσωπική σου Rock συλλογή</h2>
      
      <div class="now-playing-box">
        <p class="now-playing-title" id="nowPlaying">Φόρτωση λίστας...</p>
      </div>

      <audio id="mp3Player" controls controlsList="nodownload"></audio>

      <div class="controls-row">
        <button class="btn-secondary" onclick="prevTrack()">⏮ Προηγούμενο</button>
        <button class="btn-secondary" onclick="nextTrack()">Επόμενο ⏭</button>
      </div>
    </div>

  </div>

  <script>
    // --- RED 96.3 AUDIO CONTROLLER ---
    let liveAudio = new Audio('https://www.redfm.gr/player/');
    let isRadioPlaying = false;
    const radioBtn = document.getElementById('radioBtn');
    const radioStatus = document.getElementById('radioStatus');
    const mp3Player = document.getElementById('mp3Player');

    function toggleRadio() {
      if (!mp3Player.paused) {
        mp3Player.pause();
      }

      if (!isRadioPlaying) {
        radioStatus.innerText = "Σύνδεση με Red 96.3...";
        liveAudio.load();
        liveAudio.play().then(() => {
          isRadioPlaying = true;
          radioBtn.innerText = '⏸ PAUSE RADIO';
          radioBtn.style.background = 'linear-gradient(135deg, #444 0%, #222 100%)';
          radioStatus.innerText = "🔴 Ζωντανή μετάδοση Red 96.3";
        }).catch(err => {
          console.error(err);
          radioStatus.innerText = "Σφάλμα σύνδεσης. Πατήστε ξανά Play.";
        });
      } else {
        liveAudio.pause();
        isRadioPlaying = false;
        radioBtn.innerText = '▶ LIVE RADIO';
        radioBtn.style.background = 'linear-gradient(135deg, #ff2a4b 0%, #c41230 100%)';
        radioStatus.innerText = "Παύση μετάδοσης";
      }
    }

    // --- PLANET ROCK PLAYLIST ---
    const playlist = [
      { title: "AC/DC - Back In Black", file: "AC DC - Back In Black (Official Video).mp3" },
      { title: "AC/DC - Highway to Hell", file: "AC DC - Highway to Hell (Official Video).mp3" },
      { title: "Bon Jovi - It's My Life", file: "Bon Jovi - It's My Life [Lyrics].mp3" },
      { title: "Bon Jovi - Livin' On A Prayer", file: "Bon Jovi - Livin' On A Prayer.mp3" },
      { title: "Bon Jovi - You Give Love A Bad Name", file: "Bon Jovi - You Give Love A Bad Name.mp3" },
      { title: "Scorpions - Dynamite", file: "Dynamite (2015 - Remaster).mp3" },
      { title: "Eagles - Hotel California", file: "Eagles - Hotel California Lyric Video Lirik Indo....mp3" },
      { title: "Evanescence - Bring Me To Life", file: "Evanescence - Bring Me To Life (Official HD ....mp3" },
      { title: "Guns N' Roses - Sweet Child O' Mine", file: "Guns N' Roses - Sweet Child O' Mine (Official ....mp3" },
      { title: "Guns N' Roses - Welcome To The Jungle", file: "Guns N' Roses - Welcome To The Jungle.mp3" },
      { title: "Linkin Park - In The End", file: "In The End [Official HD Music Video] - Linkin ....mp3" },
      { title: "Kiss - I Was Made For Lovin' You", file: "Kiss - I Was Made For Lovin' You.mp3" },
      { title: "Linkin Park - Numb", file: "Numb (Official Music Video) [4K UPGRADE] -....mp3" },
      { title: "R.E.M. - Losing My Religion", file: "R.E.M. - Losing My Religion (Official HD Musi....mp3" },
      { title: "Kiss - Rock And Roll All Nite", file: "Rock And Roll All Nite.mp3" },
      { title: "Scorpions - Bad Boys Running Wild", file: "Scorpions - Bad Boys Running Wild (Visualize....mp3" },
      { title: "Scorpions - Big City Nights", file: "Scorpions - Big City Nights (Official Video).mp3" },
      { title: "Scorpions - In Trance", file: "Scorpions - In Trance.mp3" },
      { title: "Scorpions - No One Like You", file: "Scorpions - No One Like You (Official Video).mp3" },
      { title: "Scorpions - Send Me An Angel", file: "Scorpions - Send Me An Angel.mp3" },
      { title: "Scorpions - The Zoo", file: "Scorpions - The Zoo (Visualizer).mp3" },
      { title: "Scorpions - When The Smoke Is Going Down", file: "Scorpions - When The Smoke Is Going Down ....mp3" },
      { title: "Scorpions - Wind Of Change", file: "Scorpions - Wind Of Change (Official Music V....mp3" },
      { title: "Scorpions - Pictured Life", file: "Scorpions Pictured Life.mp3" },
      { title: "Scorpions - Still Loving You", file: "Still Loving You - Scorpions [Remastered].mp3" },
      { title: "Survivor - Eye Of The Tiger", file: "Survivor - Eye Of The Tiger (Official HD Video....mp3" },
      { title: "The Beatles - Here Comes The Sun", file: "The Beatles - Here Comes The Sun (Lyrics).mp3" }
    ];

    let currentTrackIndex = 0;
    const nowPlaying = document.getElementById('nowPlaying');

    function loadTrack(index) {
      if (playlist.length === 0) return;
      currentTrackIndex = index;
      mp3Player.src = playlist[currentTrackIndex].file;
      nowPlaying.innerText = "🎵 " + playlist[currentTrackIndex].title;
      mp3Player.load();
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      mp3Player.play();
    }

    function prevTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      mp3Player.play();
    }

    mp3Player.addEventListener('ended', () => {
      nextTrack();
    });

    mp3Player.addEventListener('play', () => {
      if (isRadioPlaying) {
        liveAudio.pause();
        isRadioPlaying = false;
        radioBtn.innerText = '▶ LIVE RADIO';
        radioBtn.style.background = 'linear-gradient(135deg, #ff2a4b 0%, #c41230 100%)';
        radioStatus.innerText = "";
      }
    });

    loadTrack(0);
  </script>

</body>
</html>
