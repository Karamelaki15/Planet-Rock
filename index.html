<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Rock Radio</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .main-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #181818;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #ff3b30;
      font-size: 1.8rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #ddd;
    }

    .btn {
      background-color: #ff3b30;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #e03126;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- Τμήμα Live Ραδιοφώνου (Red 96.3) -->
    <div class="card">
      <h1>🎸 Planet Rock Live</h1>
      <h2>📻 Red 96.3 (Athens Live)</h2>
      <audio id="radioPlayer" src="https://stream.radiojar.com/red963.mp3"></audio>
      <button class="btn" onclick="toggleRadio()">▶ Play Live Radio</button>
    </div>

    <!-- Τμήμα Spotify Playlist -->
    <div class="card">
      <h2>🎧 Η Rock Playlist μου</h2>
      <iframe 
        style="border-radius:12px" 
        src="https://open.spotify.com/embed/playlist/5UNtcqAckE4Bzc7V5pUYQb?utm_source=generator&theme=0" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>

  </div>

  <script>
    const radio = document.getElementById('radioPlayer');
    const btn = document.querySelector('.btn');

    function toggleRadio() {
      if (radio.paused) {
        radio.play();
        btn.innerText = '⏸ Pause Live Radio';
      } else {
        radio.pause();
        btn.innerText = '▶ Play Live Radio';
      }
    }
  </script>

</body>
</html>
